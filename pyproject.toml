[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cg-studio-pipeline"
version = "0.1.0"
description = "A local, bounded Blender pipeline with explicit multiview visual review gates"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
metrics = ["Pillow>=10"]

[project.scripts]
cgstudio = "cgstudio.__main__:main"

[tool.setuptools]
packages = ["cgstudio"]
